[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-qann"
version = "0.1.0a1"
description = "LangChain vector store backed by qann: HNSW, IVF fast-scan PQ with re-ranking, metadata filters"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maximilian Miller" }]
requires-python = ">=3.10"
dependencies = ["qann>=0.1.0a28", "langchain-core>=1.0,<2", "numpy", "scipy"]
keywords = ["langchain", "vector store", "qann", "rag", "ann"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest", "langchain-tests>=1.1,<2"]

[project.urls]
Homepage = "https://github.com/maxtmiller/qann"
Source = "https://github.com/maxtmiller/qann/tree/main/integrations/langchain-qann"

[tool.hatch.build.targets.wheel]
packages = ["langchain_qann"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
