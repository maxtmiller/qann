[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-vector-stores-qann"
version = "0.1.0a1"
description = "LlamaIndex vector store backed by qann: HNSW, IVF fast-scan PQ with re-ranking, metadata filters, BM25 / SPLADE hybrid search"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maximilian Miller" }]
requires-python = ">=3.10"
dependencies = ["qann>=0.1.0a28", "llama-index-core>=0.13,<0.15", "numpy", "scipy"]
keywords = ["llama-index", "vector store", "qann", "rag", "ann", "hybrid search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/maxtmiller/qann"
Source = "https://github.com/maxtmiller/qann/tree/main/integrations/llama-index-vector-stores-qann"

[tool.hatch.build.targets.wheel]
include = ["llama_index/vector_stores/qann"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
