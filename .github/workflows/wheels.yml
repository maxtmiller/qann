name: Wheels

# PRs touching packaging and manual runs build and test wheels only; pushing a
# v* tag also publishes to PyPI.
on:
  workflow_dispatch:
  pull_request:
    paths: [pyproject.toml, CMakeLists.txt, .github/workflows/wheels.yml]
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.3.0

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qann
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Versions like 0.1.0a2 / 1.0.0rc1 are marked as pre-releases.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
