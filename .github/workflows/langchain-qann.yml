name: langchain-qann

# Tests the LangChain integration against qann from PyPI; a langchain-qann-v*
# tag also publishes it to PyPI.
on:
  push:
    branches: [main]
    paths: [integrations/langchain-qann/**, .github/workflows/langchain-qann.yml]
    tags: ["langchain-qann-v*"]
  pull_request:
    paths: [integrations/langchain-qann/**, .github/workflows/langchain-qann.yml]

defaults:
  run:
    working-directory: integrations/langchain-qann

jobs:
  test:
    name: langchain-qann (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests -q

  build:
    if: startsWith(github.ref, 'refs/tags/langchain-qann-v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: integrations/langchain-qann/dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi-langchain-qann
      url: https://pypi.org/p/langchain-qann
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
