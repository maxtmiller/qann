name: llama-index-vector-stores-qann

# Tests the LlamaIndex integration against qann from PyPI; a llama-index-vector-stores-qann-v*
# tag also publishes it to PyPI.
on:
  push:
    branches: [main]
    paths: [integrations/llama-index-vector-stores-qann/**, .github/workflows/llama-index-vector-stores-qann.yml]
    tags: ["llama-index-vector-stores-qann-v*"]
  pull_request:
    paths: [integrations/llama-index-vector-stores-qann/**, .github/workflows/llama-index-vector-stores-qann.yml]

defaults:
  run:
    working-directory: integrations/llama-index-vector-stores-qann

jobs:
  test:
    name: llama-index-vector-stores-qann (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests -q

  build:
    if: startsWith(github.ref, 'refs/tags/llama-index-vector-stores-qann-v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: integrations/llama-index-vector-stores-qann/dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi-llama-index-vector-stores-qann
      url: https://pypi.org/p/llama-index-vector-stores-qann
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
