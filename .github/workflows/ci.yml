name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu exercises the find_package(BLAS) path with OpenBLAS;
        # macos-15 (arm64) uses Accelerate like local development; macos-14
        # images retire on 2026-11-02 (actions/runner-images#13518).
        # Ubuntu is pinned so the move of ubuntu-latest to 26 (from 2026-10-19)
        # happens on purpose, not under us.
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OpenBLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install Python dependencies
        run: python -m pip install numpy pytest scipy

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build build -j 4

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Python tests
        env:
          PYTHONPATH: build
        run: python -m pytest tests

      - name: Cache siftsmall
        if: runner.os == 'macOS'
        id: sift-cache
        uses: actions/cache@v6
        with:
          path: benchmarks/data/siftsmall
          key: siftsmall-v1

      - name: Download siftsmall
        if: runner.os == 'macOS' && steps.sift-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p benchmarks/data
          curl --retry 5 --retry-delay 10 -fsSL ftp://ftp.irisa.fr/local/texmex/corpus/siftsmall.tar.gz \
            | tar -xz -C benchmarks/data

      # The baseline was recorded with Accelerate on Apple Silicon, so the
      # gate runs on macOS only; OpenBLAS can round differently and shift
      # k-means results.
      - name: Recall regression gate (siftsmall)
        if: runner.os == 'macOS'
        env:
          PYTHONPATH: build
        run: python benchmarks/bench_indexes.py --check benchmarks/baseline_siftsmall.json

  avx512:
    # Hosted runners may lack AVX-512, so the run-time picked AVX-512 kernels
    # (#53) would go untested; Intel SDE emulates a Sapphire Rapids CPU.
    name: AVX-512 under Intel SDE
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: petarpetrovt/setup-sde@v6.0
        with:
          environmentVariableName: SDE_PATH

      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      # ctest runs every test case as its own process under SDE: one process
      # for the whole suite hit SDE's limit on threads created (parallel_for
      # starts new ones on each call) and hung.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(which python)" "-DCMAKE_CROSSCOMPILING_EMULATOR=$SDE_PATH/sde64;-spr;--"

      - name: Build
        run: cmake --build build -j 4 --target test_vecengine

      - name: C++ tests on the AVX-512 kernels
        env:
          QANN_EXPECT_AVX512: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: ctest --test-dir build -j 4 --output-on-failure

      - name: QANN_DISABLE_AVX512 keeps the AVX2 kernels
        env:
          QANN_DISABLE_AVX512: "1"
          QANN_EXPECT_AVX512: "0"
          OPENBLAS_NUM_THREADS: "1"
        run: $SDE_PATH/sde64 -spr -- ./build/test_vecengine "[simd],[sq]"
