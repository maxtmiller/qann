[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "qann"
version = "0.1.0a6"
description = "Fast nearest-neighbor vector search for Python: exact, IVF and product-quantized indexes with exact re-ranking, implemented in C++"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Maximilian Miller" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["ann", "vector search", "nearest neighbors", "product quantization", "ivf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/maxtmiller/qann"
Source = "https://github.com/maxtmiller/qann"
Issues = "https://github.com/maxtmiller/qann/issues"

[project.optional-dependencies]
bench = ["matplotlib"]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
build.targets = ["vecengine_py", "qann_stub"]
wheel.packages = []

[tool.scikit-build.cmake.define]
VECENGINE_BUILD_TESTS = "OFF"

[tool.cibuildwheel]
# Free-threaded (cp3xxt) builds are not supported.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
before-all = "dnf install -y --enablerepo=powertools openblas-devel"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
