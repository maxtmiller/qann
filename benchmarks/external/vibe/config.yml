# No inner product yet (#27), so ip datasets are skipped.
float:
  euclidean: &qann
    - base_args: ['@metric']
      constructor: QannHNSW
      disabled: false
      singularity_image: qann
      module: vibe.algorithms.qann
      name: qann-hnsw
      run_groups:
        base:
          args:
            M: [8, 16, 24, 32, 48, 64]
            ef_construction: [500]
          query_args:
            ef_search: [10, 20, 30, 40, 50, 60, 80, 100, 150, 200, 300, 400, 500, 600, 800, 1000]
    - base_args: ['@metric']
      constructor: QannHNSW
      disabled: false
      singularity_image: qann
      module: vibe.algorithms.qann
      name: qann-hnsw-sq8
      run_groups:
        base:
          args:
            M: [16, 32, 48]
            ef_construction: [500]
            sq_bits: [8]
          query_args:
            ef_search: [10, 20, 40, 60, 100, 150, 200, 300, 400, 600, 800, 1000]
            k_factor: [2, 4]
    - base_args: ['@metric']
      constructor: QannIVFFastScan
      disabled: false
      singularity_image: qann
      module: vibe.algorithms.qann
      name: qann-ivf-fastscan
      run_groups:
        base:
          args:
            nlist: [1024, 2048, 4096]
            dims_per_subspace: [2, 4]
          query_args:
            nprobe: [1, 2, 4, 8, 16, 32, 64, 128, 256]
            k_factor: [4, 8, 16]
  cosine: *qann
  normalized: *qann
