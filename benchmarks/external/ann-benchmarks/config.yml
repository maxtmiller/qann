float:
  any:
  - base_args: ['@metric']
    constructor: QannHNSW
    disabled: false
    docker_tag: ann-benchmarks-qann
    module: ann_benchmarks.algorithms.qann
    name: qann-hnsw
    run_groups:
      base:
        # up to 96 like hnswlib's sweep, so both reach the same top recall (issue #129)
        args: [[8, 16, 24, 32, 48, 64, 96], [500]]
        query_args: [[10, 20, 40, 80, 120, 200, 400, 600, 800]]
  - base_args: ['@metric']
    constructor: QannHNSW
    disabled: false
    docker_tag: ann-benchmarks-qann
    module: ann_benchmarks.algorithms.qann
    name: qann-hnsw-sq8
    run_groups:
      base:
        args: [[16, 32, 48], [500], [8]]
        query_args: [[10, 20, 40, 80, 120, 200, 400, 600, 800], [2, 4]]
  - base_args: ['@metric']
    constructor: QannIVFFastScan
    disabled: false
    docker_tag: ann-benchmarks-qann
    module: ann_benchmarks.algorithms.qann
    name: qann-ivf-fastscan
    run_groups:
      base:
        # rotation costs a dim x dim product per query and only helps when dimensions
        # are correlated across subspaces, so each dataset gets both
        # 256 and 512 for small datasets: on fashion-mnist (60k) lists at 1024+ hold under 60
        # vectors and fast-scan's per-list cost dominates (issue #62)
        args: [[256, 512, 1024, 2048, 4096], [2, 4], [true, false]]
        # k_factor up to 64: with 4-bit codes on hard data (gist) the true top 10
        # only make the re-ranked candidates at 32 or 64 (issue #64)
        query_args: [[1, 2, 4, 8, 16, 32, 64, 128, 256], [4, 8, 16, 32, 64]]
      deep:
        # glove-100 and nytimes-256 still gained recall at nlist 256, nprobe 256 (every list)
        # and k_factor 64, so the cap was the re-rank depth (issue #129). Only the builds that
        # reached the top, to keep the sweep's run time.
        args: [[256, 512], [2], [false]]
        query_args: [[128, 256], [128, 256]]
